name: Build Hermes Desktop AppImage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop-appimage.yml
  schedule:
    # 每天检查一次 NousResearch/hermes-agent 最新稳定 Release；版本未变化且构建修订未变化时直接结束。
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: hermes-desktop-appimage
  cancel-in-progress: false

permissions:
  contents: write

env:
  DESKTOP_BUILD_REVISION: '4'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check latest upstream release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/NousResearch/hermes-agent/releases/latest)"

          upstream_tag="$(jq -r '.tag_name // empty' <<<"${release_json}")"
          [[ -n "${upstream_tag}" ]] || {
            echo "无法读取 NousResearch/hermes-agent 最新 Release tag。"
            exit 1
          }

          echo "tag=${upstream_tag}" >> "${GITHUB_OUTPUT}"
          echo "上游最新稳定版本：${upstream_tag}"

      - name: Decide whether to build
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          BUILD_REVISION: ${{ env.DESKTOP_BUILD_REVISION }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "手动触发：执行 AppImage 构建。"
            exit 0
          fi

          current_body="$(gh release view desktop-latest \
            --repo "${GITHUB_REPOSITORY}" \
            --json body \
            --jq '.body' 2>/dev/null || true)"

          current_assets="$(gh release view desktop-latest \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[]?.name' 2>/dev/null || true)"

          if grep -Fq "UPSTREAM_TAG=${UPSTREAM_TAG}" <<<"${current_body}" \
            && grep -Fq "BUILD_REVISION=${BUILD_REVISION}" <<<"${current_body}" \
            && grep -Eqx 'Hermes-Desktop-linux-x86_64\.AppImage|hermes-desktop\.AppImage' <<<"${current_assets}"; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "上游版本、构建修订和现有 AppImage 均未变化：跳过构建。"
          else
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "检测到新的上游版本、构建修订或缺少 AppImage：执行构建。"
          fi

      - name: Normalize latest release title
        if: steps.gate.outputs.build == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          BUILD_REVISION: ${{ env.DESKTOP_BUILD_REVISION }}
        run: |
          set -euo pipefail

          release_notes="$(cat <<EOF_NOTES
          使用说明见 [README_AppImage.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/README_AppImage.md)。

          <!-- UPSTREAM_TAG=${UPSTREAM_TAG} -->
          <!-- BUILD_REVISION=${BUILD_REVISION} -->
          EOF_NOTES
          )"

          gh release edit desktop-latest \
            --repo "${GITHUB_REPOSITORY}" \
            --title 'Hermes Desktop AppImage (latest)' \
            --notes "${release_notes}"

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/desktop-latest")"
          old_asset_id="$(jq -r '.assets[]? | select(.name == "Hermes-Desktop-linux-x86_64.AppImage") | .id' <<<"${release_json}" | head -n 1)"
          new_asset_id="$(jq -r '.assets[]? | select(.name == "hermes-desktop.AppImage") | .id' <<<"${release_json}" | head -n 1)"

          if [[ -n "${old_asset_id}" && -z "${new_asset_id}" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${old_asset_id}" \
              -f name='hermes-desktop.AppImage' >/dev/null
            echo "已将 Release 资产重命名为 hermes-desktop.AppImage。"
          fi

      - name: Checkout upstream source
        if: steps.gate.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.upstream.outputs.tag }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        if: steps.gate.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Use upstream npm baseline
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12
          node --version
          npm --version

      - name: Install upstream dependencies
        if: steps.gate.outputs.build == 'true'
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Install Linux packaging and smoke-test dependencies
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 \
            gnome-keyring \
            libsecret-1-0 \
            patchelf \
            xauth \
            xvfb

      - name: Stage bundled libsecret runtime
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          libsecret_path="$(ldconfig -p | awk '$1 == "libsecret-1.so.0" { print $NF; exit }')"
          [[ -n "${libsecret_path}" && -f "${libsecret_path}" ]] || {
            echo "找不到 libsecret-1.so.0，停止构建。"
            exit 1
          }

          install -Dm0644 "$(readlink -f "${libsecret_path}")" \
            upstream/apps/desktop/build/linux-libs/libsecret-1.so.0

          file upstream/apps/desktop/build/linux-libs/libsecret-1.so.0
          ldd upstream/apps/desktop/build/linux-libs/libsecret-1.so.0 | tee /tmp/hermes-libsecret-ldd.log
          ! grep -Fq 'not found' /tmp/hermes-libsecret-ldd.log

      - name: Apply standalone Linux AppImage fixes
        if: steps.gate.outputs.build == 'true'
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path

          main_path = Path("apps/desktop/electron/main.ts")
          main_text = main_path.read_text(encoding="utf-8")
          keyring_marker = "Hermes standalone Linux AppImage: detect the Secret Service/KWallet backend directly"

          if keyring_marker not in main_text:
              anchor = "// Linux: point Chromium at the session's keychain backend so safeStorage can\n"
              if anchor not in main_text:
                  raise SystemExit("无法定位 Linux password-store 初始化位置，停止构建，避免错误修改上游源码。")

              keyring_patch = r'''// Hermes standalone Linux AppImage: detect the Secret Service/KWallet backend directly.
          // The official `hermes desktop` Python launcher performs this detection before
          // starting Electron, but a directly launched AppImage bypasses that launcher.
          // Keep the same detection order so KeePassXC Secret Service, GNOME Keyring and
          // KWallet can provide Electron safeStorage without forcing plaintext token storage.
          if (process.platform === 'linux' && !process.env.HERMES_DESKTOP_PASSWORD_STORE) {
            const kdeVersion = String(process.env.KDE_SESSION_VERSION || '').trim()
            let detectedPasswordStore: string | null = null

            if (kdeVersion === '6') {
              detectedPasswordStore = 'kwallet6'
            } else if (kdeVersion === '5') {
              detectedPasswordStore = 'kwallet5'
            } else if (kdeVersion || process.env.KDE_FULL_SESSION) {
              detectedPasswordStore = 'kwallet'
            } else if (process.env.GNOME_KEYRING_CONTROL) {
              detectedPasswordStore = 'gnome-libsecret'
            } else {
              try {
                execFileSync(
                  'dbus-send',
                  [
                    '--session',
                    '--print-reply',
                    '--reply-timeout=2000',
                    '--dest=org.freedesktop.secrets',
                    '/org/freedesktop/secrets',
                    'org.freedesktop.DBus.Peer.Ping'
                  ],
                  { stdio: 'ignore', timeout: 5000 }
                )
                detectedPasswordStore = 'gnome-libsecret'
              } catch {
                // No reachable Secret Service provider; keep the upstream fallback behavior.
              }
            }

            if (detectedPasswordStore) {
              process.env.HERMES_DESKTOP_PASSWORD_STORE = detectedPasswordStore
              console.log(`[hermes] standalone AppImage detected password-store backend: ${detectedPasswordStore}`)
            }
          }

          '''
              main_text = main_text.replace(anchor, keyring_patch + anchor, 1)

          locale_marker = "Hermes standalone Linux AppImage: map a Chinese system locale to Chromium zh-CN"
          if locale_marker not in main_text:
              anchor = "// Renderer debugging port. On for dev-server runs"
              if anchor not in main_text:
                  raise SystemExit("无法定位 Electron locale 初始化位置，停止构建，避免错误修改上游源码。")

              locale_patch = r'''// Hermes standalone Linux AppImage: map a Chinese system locale to Chromium zh-CN.
          // This keeps the first-run / remote-connection UI consistent with a zh_CN Linux
          // environment before Hermes has loaded a persisted display.language setting.
          if (process.platform === 'linux') {
            const systemLocale = String(
              process.env.LC_ALL || process.env.LC_MESSAGES || process.env.LANG || ''
            ).trim()

            if (/^zh(?:[_-]|$)/i.test(systemLocale)) {
              app.commandLine.appendSwitch('lang', 'zh-CN')
              console.log(`[hermes] standalone AppImage mapped Linux locale ${systemLocale} to zh-CN`)
            }
          }

          '''
              main_text = main_text.replace(anchor, locale_patch + anchor, 1)

          smoke_marker = "HERMES_DESKTOP_SAFE_STORAGE_SMOKE_TEST"
          if smoke_marker not in main_text:
              anchor = "// Windows sandbox / GPU breakpoint crash recovery"
              if anchor not in main_text:
                  raise SystemExit("无法定位 safeStorage smoke-test 插入位置，停止构建，避免错误修改上游源码。")

              smoke_patch = r'''// CI-only runtime verification for the final standalone AppImage.
          // It is inert during normal launches and exits immediately after checking the
          // selected backend, real encrypt/decrypt round-trip, and Chinese locale mapping.
          if (process.env.HERMES_DESKTOP_SAFE_STORAGE_SMOKE_TEST === '1') {
            app
              .whenReady()
              .then(() => {
                const backend = safeStorage.getSelectedStorageBackend()
                const available = safeStorage.isEncryptionAvailable()
                const locale = app.getLocale()
                console.log(`[hermes-smoke] safeStorage backend=${backend} encryptionAvailable=${available}`)
                console.log(`[hermes-smoke] appLocale=${locale}`)

                if (backend !== 'gnome_libsecret' || !available || !locale.toLowerCase().startsWith('zh')) {
                  app.exit(91)
                  return
                }

                const original = 'hermes-safe-storage-smoke-test'
                const encrypted = safeStorage.encryptString(original)
                const decrypted = safeStorage.decryptString(encrypted)
                const roundTrip = decrypted === original
                console.log(`[hermes-smoke] safeStorage roundTrip=${roundTrip}`)
                app.exit(roundTrip ? 0 : 92)
              })
              .catch(error => {
                console.error(`[hermes-smoke] failed: ${String(error)}`)
                app.exit(93)
              })
          }

          '''
              main_text = main_text.replace(anchor, smoke_patch + anchor, 1)

          main_path.write_text(main_text, encoding="utf-8")

          renderer_path = Path("apps/desktop/src/main.tsx")
          renderer_text = renderer_path.read_text(encoding="utf-8")
          locale_open = "<I18nProvider>"
          locale_fixed = "<I18nProvider initialLocale={navigator.language}>"

          if locale_fixed not in renderer_text:
              if renderer_text.count(locale_open) != 1:
                  raise SystemExit("无法唯一定位 I18nProvider，停止构建，避免错误修改上游源码。")
              renderer_text = renderer_text.replace(locale_open, locale_fixed, 1)
              renderer_path.write_text(renderer_text, encoding="utf-8")

          context_path = Path("apps/desktop/src/i18n/context.tsx")
          context_text = context_path.read_text(encoding="utf-8")
          old_locale_line = "          setLocaleState(normalizeLocale(getConfigDisplayLanguage(config)))"
          new_locale_line = (
              "          const configuredLocale = getConfigDisplayLanguage(config)\n"
              "          setLocaleState(\n"
              "            configuredLocale == null ? normalizeLocale(initialLocale) : normalizeLocale(configuredLocale)\n"
              "          )"
          )

          if "configuredLocale == null ? normalizeLocale(initialLocale)" not in context_text:
              if context_text.count(old_locale_line) != 1:
                  raise SystemExit("无法唯一定位 Desktop 语言初始化逻辑，停止构建，避免错误修改上游源码。")
              context_text = context_text.replace(old_locale_line, new_locale_line, 1)
              context_path.write_text(context_text, encoding="utf-8")

          preload_path = Path("apps/desktop/electron/preload.ts")
          preload_text = preload_path.read_text(encoding="utf-8")
          update_bridge_marker = "Hermes standalone Linux AppImage: disable source-checkout desktop self-update"

          if update_bridge_marker not in preload_text:
              old_update_bridge = (
                  "  updates: {\n"
                  "    check: () => ipcRenderer.invoke('hermes:updates:check'),\n"
                  "    apply: opts => ipcRenderer.invoke('hermes:updates:apply', opts),\n"
                  "    getBranch: () => ipcRenderer.invoke('hermes:updates:branch:get'),\n"
                  "    setBranch: name => ipcRenderer.invoke('hermes:updates:branch:set', name),\n"
              )
              new_update_bridge = (
                  "  updates: {\n"
                  "    // Hermes standalone Linux AppImage: disable source-checkout desktop self-update.\n"
                  "    // AppImage updates are distributed through the repository's desktop-latest Release.\n"
                  "    check: () => Promise.resolve(null),\n"
                  "    apply: _opts =>\n"
                  "      Promise.resolve({\n"
                  "        ok: false,\n"
                  "        error: 'unavailable',\n"
                  "        message: 'Desktop self-update is disabled for this standalone AppImage.'\n"
                  "      }),\n"
                  "    getBranch: () => Promise.resolve(null),\n"
                  "    setBranch: _name => Promise.resolve(null),\n"
              )
              if preload_text.count(old_update_bridge) != 1:
                  raise SystemExit("无法唯一定位 Desktop update preload bridge，停止构建，避免错误修改上游源码。")
              preload_text = preload_text.replace(old_update_bridge, new_update_bridge, 1)
              preload_path.write_text(preload_text, encoding="utf-8")

          about_path = Path("apps/desktop/src/app/settings/about-settings.tsx")
          about_text = about_path.read_text(encoding="utf-8")
          about_marker = "Hermes standalone Linux AppImage: hide source-checkout desktop update controls"

          if about_marker not in about_text:
              version_anchor = (
                  '          <p className="mt-1 text-xs text-muted-foreground">\n'
                  '            {version?.appVersion ? a.version(version.appVersion) : a.versionUnavailable}\n'
                  '          </p>\n'
              )
              release_notes_button = (
                  '          <Button asChild className="mt-1" size="sm" variant="text">\n'
                  '            <a\n'
                  '              href={RELEASE_NOTES_URL}\n'
                  '              onClick={event => {\n'
                  '                event.preventDefault()\n'
                  '                void window.hermesDesktop?.openExternal?.(RELEASE_NOTES_URL)\n'
                  '              }}\n'
                  '              rel="noreferrer"\n'
                  '              target="_blank"\n'
                  '            >\n'
                  '              <ExternalLink className="size-3" />\n'
                  '              {a.releaseNotes}\n'
                  '            </a>\n'
                  '          </Button>\n'
              )
              if about_text.count(version_anchor) != 1:
                  raise SystemExit("无法唯一定位 About 版本信息，停止构建，避免错误修改上游源码。")
              about_text = about_text.replace(version_anchor, version_anchor + release_notes_button, 1)

              updates_open = '        <SectionHeading icon={RefreshCw} title={a.updates} />\n'
              updates_close = (
                  '        <ListRow\n'
                  '          description={a.automaticUpdatesDesc}\n'
                  "          hint={a.branchCommit(status?.branch ?? 'unknown', status?.currentSha?.slice(0, 7) ?? 'unknown')}\n"
                  '          title={a.automaticUpdates}\n'
                  '        />\n'
              )
              if about_text.count(updates_open) != 1 or about_text.count(updates_close) != 1:
                  raise SystemExit("无法唯一定位 About 更新区域，停止构建，避免错误修改上游源码。")
              update_wrapper_open = (
                  '        {/* Hermes standalone Linux AppImage: hide source-checkout desktop update controls. */}\n'
                  '        <div className="hidden">\n'
              )
              about_text = about_text.replace(updates_open, update_wrapper_open + updates_open, 1)
              about_text = about_text.replace(updates_close, updates_close + '        </div>\n', 1)
              about_path.write_text(about_text, encoding="utf-8")

          package_path = Path("apps/desktop/package.json")
          package_data = json.loads(package_path.read_text(encoding="utf-8"))
          extra_resources = package_data.setdefault("build", {}).setdefault("extraResources", [])
          libsecret_resource = {
              "from": "build/linux-libs/libsecret-1.so.0",
              "to": "linux-libs/libsecret-1.so.0",
          }
          if libsecret_resource not in extra_resources:
              extra_resources.append(libsecret_resource)
          package_path.write_text(json.dumps(package_data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          after_pack_path = Path("apps/desktop/scripts/after-pack.mjs")
          after_pack_text = after_pack_path.read_text(encoding="utf-8")
          rpath_marker = "Hermes standalone Linux AppImage: add the bundled libsecret directory to Electron RUNPATH"

          if rpath_marker not in after_pack_text:
              import_anchor = "import path from 'node:path'\n"
              if import_anchor not in after_pack_text:
                  raise SystemExit("无法定位 afterPack import，停止构建，避免错误修改上游源码。")
              after_pack_text = after_pack_text.replace(
                  import_anchor,
                  "import { execFile } from 'node:child_process'\n"
                  "import path from 'node:path'\n"
                  "import { promisify } from 'node:util'\n",
                  1,
              )

              function_anchor = "export default async function afterPack(context) {\n"
              if function_anchor not in after_pack_text:
                  raise SystemExit("无法定位 afterPack 函数，停止构建，避免错误修改上游源码。")

              rpath_patch = r'''export default async function afterPack(context) {
          // Hermes standalone Linux AppImage: add the bundled libsecret directory to Electron RUNPATH.
          // Chromium loads libsecret with dlopen("libsecret-1.so.0"), so selecting
          // gnome-libsecret alone is insufficient on hosts where the client library is absent.
          if (context.electronPlatformName === 'linux') {
            const productName = context.packager?.appInfo?.productFilename || 'Hermes'
            const executable = path.join(context.appOutDir, productName)
            const execFileAsync = promisify(execFile)
            const { stdout } = await execFileAsync('patchelf', ['--print-rpath', executable])
            const bundledLibsecretRpath = '$ORIGIN/resources/linux-libs'
            const existingRpath = stdout.trim()
            const rpathParts = existingRpath ? existingRpath.split(':').filter(Boolean) : []

            if (!rpathParts.includes(bundledLibsecretRpath)) {
              rpathParts.push(bundledLibsecretRpath)
              await execFileAsync('patchelf', ['--set-rpath', rpathParts.join(':'), executable])
            }

            console.log(`[after-pack] Linux Electron RUNPATH includes ${bundledLibsecretRpath}`)
            return
          }

          '''
              after_pack_text = after_pack_text.replace(function_anchor, rpath_patch, 1)
              after_pack_path.write_text(after_pack_text, encoding="utf-8")

          print("Standalone Linux fixes applied.")
          PY

          grep -Fq 'Hermes standalone Linux AppImage: detect the Secret Service/KWallet backend directly' \
            apps/desktop/electron/main.ts
          grep -Fq 'Hermes standalone Linux AppImage: map a Chinese system locale to Chromium zh-CN' \
            apps/desktop/electron/main.ts
          grep -Fq 'HERMES_DESKTOP_SAFE_STORAGE_SMOKE_TEST' \
            apps/desktop/electron/main.ts
          grep -Fq '<I18nProvider initialLocale={navigator.language}>' \
            apps/desktop/src/main.tsx
          grep -Fq 'configuredLocale == null ? normalizeLocale(initialLocale)' \
            apps/desktop/src/i18n/context.tsx
          grep -Fq 'Hermes standalone Linux AppImage: disable source-checkout desktop self-update' \
            apps/desktop/electron/preload.ts
          ! grep -Fq "ipcRenderer.invoke('hermes:updates:check')" \
            apps/desktop/electron/preload.ts
          ! grep -Fq "ipcRenderer.invoke('hermes:updates:apply'" \
            apps/desktop/electron/preload.ts
          ! grep -Fq "ipcRenderer.invoke('hermes:updates:branch:get')" \
            apps/desktop/electron/preload.ts
          ! grep -Fq "ipcRenderer.invoke('hermes:updates:branch:set'" \
            apps/desktop/electron/preload.ts
          grep -Fq 'Hermes standalone Linux AppImage: hide source-checkout desktop update controls' \
            apps/desktop/src/app/settings/about-settings.tsx
          grep -Fq '"to": "linux-libs/libsecret-1.so.0"' \
            apps/desktop/package.json
          grep -Fq 'Hermes standalone Linux AppImage: add the bundled libsecret directory to Electron RUNPATH' \
            apps/desktop/scripts/after-pack.mjs

      - name: Type-check patched Desktop source
        if: steps.gate.outputs.build == 'true'
        working-directory: upstream/apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck

      - name: Build patched official Desktop AppImage
        if: steps.gate.outputs.build == 'true'
        working-directory: upstream/apps/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail

          npm run build
          npm run builder -- --linux AppImage --x64 --publish never

      - name: Prepare and statically verify AppImage
        if: steps.gate.outputs.build == 'true'
        id: asset
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t appimages < <(find upstream/apps/desktop/release \
            -maxdepth 1 -type f -name '*.AppImage' -print)

          if [[ "${#appimages[@]}" -ne 1 ]]; then
            echo "预期得到 1 个 AppImage，实际得到 ${#appimages[@]} 个。"
            printf '%s\n' "${appimages[@]}"
            exit 1
          fi

          mkdir -p dist
          asset="dist/hermes-desktop.AppImage"
          install -m 0755 "${appimages[0]}" "${asset}"

          test -s "${asset}"
          file "${asset}" | grep -q 'ELF 64-bit'

          appimage_offset="$("${asset}" --appimage-offset)"
          [[ "${appimage_offset}" =~ ^[0-9]+$ ]]
          (( appimage_offset > 0 ))

          extract_dir="$(mktemp -d)"
          asset_abs="$(realpath "${asset}")"
          (
            cd "${extract_dir}"
            "${asset_abs}" --appimage-extract >/dev/null
          )

          appdir="${extract_dir}/squashfs-root"

          # Electron 简体中文 locale 资源必须随 AppImage 一起存在。
          test -f "${appdir}/locales/zh-CN.pak"

          # Chromium gnome-libsecret 后端所需的客户端库必须内置。
          test -f "${appdir}/resources/linux-libs/libsecret-1.so.0"

          # Electron 主程序必须通过 RUNPATH 能直接找到 AppImage 内置 libsecret。
          readelf -d "${appdir}/Hermes" | tee /tmp/hermes-electron-dynamic.log
          grep -Fq '$ORIGIN/resources/linux-libs' /tmp/hermes-electron-dynamic.log

          rm -rf "${extract_dir}"

          echo "path=${asset}" >> "${GITHUB_OUTPUT}"
          sha256sum "${asset}"

      - name: Runtime-test final AppImage secure storage
        if: steps.gate.outputs.build == 'true'
        shell: bash
        env:
          ASSET_PATH: ${{ steps.asset.outputs.path }}
        run: |
          set -euo pipefail

          asset_abs="$(realpath "${ASSET_PATH}")"
          smoke_home="$(mktemp -d)"
          host_libsecret="$(ldconfig -p | awk '$1 == "libsecret-1.so.0" { print $NF; exit }')"
          host_libsecret_disabled="${host_libsecret}.hermes-ci-disabled"

          [[ -n "${host_libsecret}" && -e "${host_libsecret}" ]] || {
            echo "无法定位宿主机 libsecret-1.so.0，无法执行隔离 smoke test。"
            exit 1
          }

          cleanup() {
            if [[ -e "${host_libsecret_disabled}" || -L "${host_libsecret_disabled}" ]]; then
              sudo mv "${host_libsecret_disabled}" "${host_libsecret}"
            fi
            rm -rf "${smoke_home}"
          }
          trap cleanup EXIT

          # 临时隐藏 Runner 的系统 libsecret，确保最终 AppImage 实际依赖的是自身内置副本。
          sudo mv "${host_libsecret}" "${host_libsecret_disabled}"

          dbus-run-session -- bash -euo pipefail -c '
            export HOME="$1"
            export XDG_RUNTIME_DIR="${HOME}/runtime"
            mkdir -p "${XDG_RUNTIME_DIR}"
            chmod 700 "${XDG_RUNTIME_DIR}"

            eval "$(printf "%s\n" "hermes-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
            if [[ -n "${GNOME_KEYRING_CONTROL:-}" ]]; then
              export GNOME_KEYRING_CONTROL
            fi

            LANG=zh_CN.UTF-8 \
            HERMES_DESKTOP_SAFE_STORAGE_SMOKE_TEST=1 \
            xvfb-run -a "$2" --appimage-extract-and-run --no-sandbox
          ' bash "${smoke_home}" "${asset_abs}" 2>&1 | tee /tmp/hermes-appimage-smoke.log

          grep -Fq '[hermes] standalone AppImage detected password-store backend: gnome-libsecret' \
            /tmp/hermes-appimage-smoke.log
          grep -Fq '[hermes-smoke] safeStorage backend=gnome_libsecret encryptionAvailable=true' \
            /tmp/hermes-appimage-smoke.log
          grep -Fq '[hermes-smoke] safeStorage roundTrip=true' \
            /tmp/hermes-appimage-smoke.log
          grep -Eiq '\[hermes-smoke\] appLocale=zh([_-]|$)' \
            /tmp/hermes-appimage-smoke.log

      - name: Publish desktop-latest release
        if: steps.gate.outputs.build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          BUILD_REVISION: ${{ env.DESKTOP_BUILD_REVISION }}
          ASSET_PATH: ${{ steps.asset.outputs.path }}
        run: |
          set -euo pipefail

          release_notes="$(cat <<EOF_NOTES
          使用说明见 [README_AppImage.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/README_AppImage.md)。

          <!-- UPSTREAM_TAG=${UPSTREAM_TAG} -->
          <!-- BUILD_REVISION=${BUILD_REVISION} -->
          EOF_NOTES
          )"

          if gh release view desktop-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload desktop-latest "${ASSET_PATH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber

            gh release edit desktop-latest \
              --repo "${GITHUB_REPOSITORY}" \
              --title 'Hermes Desktop AppImage (latest)' \
              --notes "${release_notes}"
          else
            gh release create desktop-latest "${ASSET_PATH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title 'Hermes Desktop AppImage (latest)' \
              --notes "${release_notes}" \
              --latest
          fi
